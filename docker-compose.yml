networks:
  splash_default:
    external: true

volumes:
  pincushion_data:
    name: splash_pincushion_data
    external: true

services:
  pincushion:
    build: .
    container_name: pincushion
    restart: unless-stopped
    networks:
      - splash_default
    environment:
      PINCUSHION_DATA_DIR: /data
      PINCUSHION_DB_PATH: /data/pincushion.db
      PINCUSHION_LIBRARY_DIR: /data/library
      PINCUSHION_IA_USER_AGENT: ${PINCUSHION_IA_USER_AGENT:-PinCushion/0.1 (self-hosted; contact via local admin)}
      PINCUSHION_EUROPEANA_API_KEY: ${PINCUSHION_EUROPEANA_API_KEY:-apidemo}
      PINCUSHION_SI_API_KEY: ${PINCUSHION_SI_API_KEY:-}
      PINCUSHION_PIXABAY_API_KEY: ${PINCUSHION_PIXABAY_API_KEY:-}
      PINCUSHION_DMC_ALGOLIA_APP_ID: ${PINCUSHION_DMC_ALGOLIA_APP_ID:-}
      PINCUSHION_DMC_ALGOLIA_SEARCH_KEY: ${PINCUSHION_DMC_ALGOLIA_SEARCH_KEY:-}
      PINCUSHION_DMC_ALGOLIA_INDEX: ${PINCUSHION_DMC_ALGOLIA_INDEX:-}
      PINCUSHION_GITHUB_REPO: ${PINCUSHION_GITHUB_REPO:-}
      PINCUSHION_GITHUB_RELEASE_PREFIX: ${PINCUSHION_GITHUB_RELEASE_PREFIX:-pincushion-}
    volumes:
      - pincushion_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8765/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
